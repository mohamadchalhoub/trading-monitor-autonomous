services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading_monitor
      POSTGRES_PASSWORD: trading_monitor_dev_password
      POSTGRES_DB: trading_monitor
    ports:
      # Host port 5433, not 5432 — this machine already runs an unrelated
      # Postgres container on 5432 for a different project.
      - "5433:5432"
    volumes:
      - trading_monitor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trading-monitor-redis
    restart: unless-stopped
    # AOF persistence — Phase 5 (PHASE5_DELIVERY_SPEC.md §12): the reconciliation
    # sweep is the safety net for a Redis outage/data loss, but persistence
    # makes recovery immediate instead of waiting on the sweep interval.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host port 6380, not the default 6379 — same reasoning as Postgres's
      # 5433: avoid colliding with another project's Redis on this machine.
      - "6380:6379"
    volumes:
      - trading_monitor_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trading_monitor_pgdata:
  trading_monitor_redisdata:
